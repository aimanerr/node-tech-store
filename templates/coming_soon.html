<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NODE. — Binnenkort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1013; --surface:#16191E; --ink:#E8EAEE; --ink-soft:#8B9098;
    --line:#262A31; --accent:#2B5CFF;
    --mono:'IBM Plex Mono',monospace; --grotesk:'Space Grotesk',sans-serif; --sans:'Inter',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);
    min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:6vh 6vw;-webkit-font-smoothing:antialiased;
  }
  .logo{font-family:var(--grotesk);font-weight:700;font-size:26px;margin-bottom:auto;}
  .cursor{display:inline-block;width:.5em;background:var(--accent);animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  .status{
    font-family:var(--mono);font-size:13px;color:var(--accent);
    display:flex;align-items:center;gap:10px;margin-bottom:28px;
  }
  .dot{width:7px;height:7px;background:var(--accent);border-radius:50%;animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

  h1{font-family:var(--grotesk);font-weight:600;font-size:clamp(40px,7vw,88px);line-height:1.03;letter-spacing:-0.02em;max-width:14ch;}
  p{margin-top:26px;max-width:44ch;color:var(--ink-soft);font-size:17px;line-height:1.65;}

  .meta{
    margin-top:auto;padding-top:48px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:12px;color:var(--ink-soft);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;
  }
  @media (prefers-reduced-motion:reduce){.cursor,.dot{animation:none;}}
</style>
</head>
<body>

  <div class="logo">NODE.<span class="cursor">_</span></div>

  <div>
    <div class="status"><span class="dot"></span>STATUS: IN AANBOUW</div>
    <h1>Binnenkort open.</h1>
    <p>
      We zijn de laatste dingen aan het afwerken. Zorgvuldig geselecteerde tech,
      verzonden vanuit België, zonder marketingruis.
    </p>
  </div>

  <div class="meta">
    <span>hello@nodetech.be</span>
    <span>GENT, BELGIË</span>
  </div>

<script>
  console.log("%cNODE._", "font-family:monospace;font-size:28px;font-weight:bold;color:#2B5CFF;");
  console.log("%cNieuwsgierig? Goed bezig. Nog even geduld.", "font-family:monospace;font-size:13px;color:#8B9098;");
</script>

</body>
</html>
