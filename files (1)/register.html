{% extends "base.html" %}
{% block title %}{{ t('register_title') }} — NODE.{% endblock %}
{% block content %}
<div class="container" style="max-width:620px;">
  <div class="form-card">
    <h1 style="font-size:30px; margin-bottom:6px;">{{ t('register_title') }}</h1>
    <p style="color:var(--ink-soft); font-size:14px;">{{ t('register_sub') }}</p>

    <form method="POST">
      <label>{{ t('register_name') }}</label>
      <input type="text" name="name" placeholder="{{ t('register_name_ph') }}" required>

      <label>{{ t('login_email') }}</label>
      <input type="email" name="email" placeholder="jij@voorbeeld.be" required>

      <label>{{ t('login_password') }}</label>
      <input type="password" name="password" placeholder="{{ t('register_password_ph') }}" required minlength="6">

      <button type="submit" class="btn" style="width:100%;">{{ t('register_button') }}</button>
    </form>

    <p style="margin-top:24px; font-size:14px; color:var(--ink-soft); text-align:center;">
      {{ t('register_has_account') }} <a href="{{ url_for('login') }}" style="color:var(--accent);">{{ t('register_login') }}</a>
    </p>
  </div>
</div>
{% endblock %}
