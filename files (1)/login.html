{% extends "base.html" %}
{% block title %}{{ t('login_title') }} — NODE.{% endblock %}
{% block content %}
<div class="container" style="max-width:620px;">
  <div class="form-card">
    <h1 style="font-size:30px; margin-bottom:6px;">{{ t('login_title') }}</h1>
    <p style="color:var(--ink-soft); font-size:14px;">{{ t('login_sub') }}</p>

    <form method="POST">
      <label>{{ t('login_email') }}</label>
      <input type="email" name="email" placeholder="jij@voorbeeld.be" required>

      <label>{{ t('login_password') }}</label>
      <input type="password" name="password" placeholder="••••••••" required>

      <button type="submit" class="btn" style="width:100%;">{{ t('login_button') }}</button>
    </form>

    <p style="margin-top:24px; font-size:14px; color:var(--ink-soft); text-align:center;">
      {{ t('login_no_account') }} <a href="{{ url_for('register') }}" style="color:var(--accent);">{{ t('login_create') }}</a>
    </p>
  </div>
</div>
{% endblock %}
